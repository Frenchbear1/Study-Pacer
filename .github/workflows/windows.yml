# Builds the Windows app (Study Pacer.exe and its installer) and puts both on the "Windows app" release page.
# Runs on its own when the app's files change on main, or from the Actions tab: "Windows app" -> "Run workflow".
name: Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['js/**', 'css/**', 'index.html', 'vendor/**', 'src-tauri/**', 'scripts/**', '.github/workflows/windows.yml']

permissions:
  contents: write

concurrency:
  group: windows-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build
        run: npx tauri build
      - name: Collect
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/study-pacer.exe "out/StudyPacer.exe"
          cp src-tauri/target/release/bundle/nsis/*.exe "out/StudyPacer-Setup.exe"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: StudyPacer-Windows
          path: out/*.exe
      - name: Publish to the "Windows app" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows >/dev/null 2>&1 || gh release create windows --title "Windows app" --notes "Study Pacer for Windows. StudyPacer.exe runs without installing; StudyPacer-Setup.exe installs it (Start menu, uninstaller)." --latest=false
          gh release upload windows out/StudyPacer.exe out/StudyPacer-Setup.exe --clobber
