[package]
name = "study-pacer"
version = "1.0.0"
description = "Study Pacer for Windows"
edition = "2021"

[lib]
name = "study_pacer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# small and quick: one optimised, stripped binary
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
